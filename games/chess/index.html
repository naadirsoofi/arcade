<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chess | Arcade</title>
    <meta name="description" content="Play the full game of chess in your browser against the computer on three levels, or with a friend on one screen. Drag, tap or use the keyboard.">
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="bar">
        <a class="back" href="../../">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
            Arcade
        </a>
        <h1>Chess</h1>
    </header>

    <main class="game" id="game" data-state="ready">
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <p class="sr-only" id="announce" aria-live="polite"></p>

        <div class="seat" id="seat-top">
            <span class="who"><i class="turn-dot" aria-hidden="true"></i><b class="name"></b></span>
            <span class="taken"></span>
        </div>

        <div class="frame">
            <div class="ranks" id="ranks" aria-hidden="true"></div>
            <div class="board" id="board" tabindex="0" role="application" aria-label="Chess board. Arrow keys move the cursor, Enter or Space picks up and places a piece.">
                <div class="squares" id="squares"></div>
                <div class="pieces" id="pieces"></div>
                <div class="promotion" id="promotion" role="dialog" aria-label="Choose a piece for the promotion" hidden></div>
            </div>
            <div class="files" id="files" aria-hidden="true"></div>
        </div>

        <div class="seat" id="seat-bottom">
            <span class="who"><i class="turn-dot" aria-hidden="true"></i><b class="name"></b></span>
            <span class="taken"></span>
        </div>

        <ol class="moves" id="moves" aria-label="Moves played"></ol>

        <div class="controls">
            <button class="btn" id="undo" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
                Undo
            </button>
            <button class="btn" id="flip" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16"/><path d="M3 8l4-4 4 4"/><path d="M17 20V4"/><path d="M13 16l4 4 4-4"/></svg>
                Flip
            </button>
            <button class="btn" id="new" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                New game
            </button>
        </div>

        <section class="overlay" id="start-screen" aria-labelledby="start-title">
            <div class="card">
                <h2 id="start-title">Chess</h2>
                <p>Trap the other king in checkmate. Play the computer, or a friend on this screen.</p>
                <ul class="howto">
                    <li><b>Touch or mouse</b> Drag a piece, or tap it and then tap its new square.</li>
                    <li><b>Keyboard</b> Arrows move the cursor, Enter or Space picks up and places.</li>
                </ul>
                <div class="option" role="group" aria-label="Opponent">
                    <button class="choice" type="button" data-option="mode" data-value="computer">Computer</button>
                    <button class="choice" type="button" data-option="mode" data-value="pair">Two players</button>
                </div>
                <div class="option" id="level-option" role="group" aria-label="Level">
                    <button class="choice" type="button" data-option="level" data-value="easy">Easy</button>
                    <button class="choice" type="button" data-option="level" data-value="medium">Medium</button>
                    <button class="choice" type="button" data-option="level" data-value="hard">Hard</button>
                </div>
                <div class="option" id="side-option" role="group" aria-label="Your side">
                    <button class="choice" type="button" data-option="side" data-value="white">Play White</button>
                    <button class="choice" type="button" data-option="side" data-value="black">Play Black</button>
                </div>
                <div class="actions">
                    <button class="btn primary" id="start" type="button">Start game</button>
                    <button class="btn" id="resume" type="button" hidden>Back to game</button>
                </div>
            </div>
        </section>

        <section class="overlay" id="end-screen" aria-labelledby="end-title" hidden>
            <div class="card" id="end-card">
                <p class="eyebrow" id="end-eyebrow"></p>
                <h2 id="end-title"></h2>
                <p id="end-note"></p>
                <dl class="results" id="results"></dl>
                <div class="actions">
                    <button class="btn primary" id="again" type="button">Play again</button>
                    <button class="btn" id="review" type="button">See the board</button>
                </div>
            </div>
        </section>
    </main>

    <script src="engine.js"></script>
    <script src="game.js"></script>
</body>
</html>

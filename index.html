<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arcade | Naadir Soofi</title>
    <meta name="description" content="A growing collection of original browser games by Naadir Soofi. Free, no sign-up, playable on phone and desktop.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="top">
        <a class="brand" href="./">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="6" r="2.5"/><path d="M10 8.5V15"/><path d="M4 19v-2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2z"/><path d="M16 12h1.5"/></svg>
            <span>Arcade</span>
        </a>
        <a class="back" href="https://naadirsoofi.com/playground.html">Back to Playground</a>
    </header>
    <div class="stripes" aria-hidden="true"><span></span><span></span><span></span></div>

    <main>
        <section class="hero">
            <h1>Arcade</h1>
            <p>Original browser games. Free, no sign-up, playable on phone and desktop.</p>
            <p id="game-count" class="count"></p>
        </section>

        <section aria-label="Games">
            <div id="game-grid" class="grid"></div>
            <div id="empty" class="empty" hidden>
                <h2>First games are on the way</h2>
                <p>The cabinets are being wired up. Check back soon.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Built by <a href="https://naadirsoofi.com/">Naadir Soofi</a></p>
    </footer>

    <script src="games.js"></script>
    <script src="script.js"></script>
</body>
</html>
